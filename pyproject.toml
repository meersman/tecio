[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tecio"
version = "0.0.1"
description = "Scientific data processing tools"

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]
keywords = ["tecplot", "tecio", "pytecplot", "cfd", "python", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]


[project.scripts]
teconvert = "tecio.cli.teconvert:main"
tecdump = "tecio.cli.tecdump:main"
tecextract = "tecio.cli.tecextract:main"
tecfix = "tecio.cli.tecfix:main"
tecmerge = "tecio.cli.tecmerge:main"
tecscale = "tecio.cli.tecscale:main"
tecslice = "tecio.cli.tecslice:main"
tecstats = "tecio.cli.tecstats:main"
tecsplit = "tecio.cli.tecsplit:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "genbadge"
]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.1",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]

[tool.setuptools.packages.find]
include = ["tecio*"]
exclude = ["demos*", "archive*", "test*"]

[tool.ruff]
line-length = 88
target-version = "py310"
output-format = "concise"

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
select = [
   "E",  # pycodestyle
   "D",  # pydocstyle
   "F",  # Pyflakes
   "UP",  # pyupgrade
   "B",  # flake8-bugbear
   "SIM",  # flake8-simplify
   "I",  # isort
]
ignore = ["D203", "D213", "SIM105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.terminal]
output-format = "concise"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = ["tecio", "tecio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["tecio"]
testpaths = ["tests"]