[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tecio-python"
version = "0.2.1"
description = "Python interface for reading and writing Tecplot data files"

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]
keywords = ["tecplot", "tecio", "cfd", "data", "visualization", "szplt", "plt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",    
]

[project.urls]
Homepage = "https://github.com/meersman/tecio"
Documentation = "https://meersman.github.io/tecio/"
Repository = "https://github.com/meersman/tecio"
Issues = "https://github.com/meersman/tecio/issues"
Changelog = "https://github.com/meersman/tecio/blob/main/docs/changelog.md"

[project.scripts]
tec2mat = "tecio.cli.tec2mat:main"
tecaux = "tecio.cli.tecaux:main"
teconvert = "tecio.cli.teconvert:main"
tecdump = "tecio.cli.tecdump:main"
tecextract = "tecio.cli.tecextract:main"
tecfix = "tecio.cli.tecfix:main"
tecmerge = "tecio.cli.tecmerge:main"
tecscale = "tecio.cli.tecscale:main"
tecslice = "tecio.cli.tecslice:main"
tecstats = "tecio.cli.tecstats:main"
tecsplilt = "tecio.cli.tecsplilt:main"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.1",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]
mat = ["scipy"]

[tool.setuptools.packages.find]
include = ["tecio*"]
exclude = ["archive*", "test*"]

[tool.ruff]
line-length = 88
target-version = "py310"
output-format = "concise"

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
select = [
   "E",    # pycodestyle
   "D",    # pydocstyle
   "F",    # Pyflakes
   "UP",   # pyupgrade
   "B",    # flake8-bugbear
   "SIM",  # flake8-simplify
   "I",    # isort
]
ignore = ["D203", "D213", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # allow assert statements in tests
    "ANN",    # don't require type annotations in tests
    "D",      # don't require docstrings in tests
]
"docs/_demos/**/*.py" = ["E", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.terminal]
output-format = "concise"

[tool.pytest.ini_options]
pythonpath = ["tecio"]
testpaths = ["tests"]