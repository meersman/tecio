[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tecio"
version = "0.1.0"
description = "Scientific data processing tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.scripts]
szldump = "tecio.cli.szldump:main"
pltdump = "tecio.cli.pltdump:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
line-length = 88
target-version = "py310"
output-format = "concise"

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
select = [
   "E",  # pycodestyle
   "D",  # pydocstyle
   "F",  # Pyflakes
   "UP",  # pyupgrade
   "B",  # flake8-bugbear
   "SIM",  # flake8-simplify
   "I",  # isort
]
ignore = ["D203", "D213"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = ["tecio", "tecio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["tecio"]
testpaths = ["tests"]