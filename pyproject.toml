[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tecio-python"
version = "0.3.3"
description = "Python interface for reading and writing Tecplot data files"

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]
keywords = ["tecplot", "tecio", "cfd", "data", "visualization", "szplt", "plt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",    
]

[project.urls]
Homepage = "https://github.com/meersman/tecio"
Documentation = "https://meersman.github.io/tecio/"
Repository = "https://github.com/meersman/tecio"
Issues = "https://github.com/meersman/tecio/issues"
Changelog = "https://github.com/meersman/tecio/blob/main/docs/changelog.md"

[project.scripts]
tec2mat = "tecio.cli.tec2mat:main"
tecaux = "tecio.cli.tecaux:main"
teconvert = "tecio.cli.teconvert:main"
tecdump = "tecio.cli.tecdump:main"
tecextract = "tecio.cli.tecextract:main"
tecfix = "tecio.cli.tecfix:main"
tecmerge = "tecio.cli.tecmerge:main"
tecscale = "tecio.cli.tecscale:main"
tecslice = "tecio.cli.tecslice:main"
tecstats = "tecio.cli.tecstats:main"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.1",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]
mat = ["scipy"]

[tool.setuptools.packages.find]
include = ["tecio*"]
exclude = ["archive*", "test*"]

[tool.setuptools.data-files]
"share/plugins/paraview" = ["plugins/paraview/*"]
"share/plugins/matlab" = ["plugins/matlab/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
output-format = "concise"
output-prefer-rule-codes = true

[tool.ruff.format]
preview = true
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = [
   # Groups
   "E",    # pycodestyle
   "W",    # pycodestyle
   "D",    # pydocstyle
   "F",    # Pyflakes
   "UP",   # pyupgrade
   "B",    # flake8-bugbear
   "SIM",  # flake8-simplify
   "A",    # flake8-builtins
   "C4",   # flake8-comprehensions
   "T10",  # flake8-debugger
   "I",    # isort
   "N",    # pip8-naming

   # Explicit preview rules
   "DOC102",
   #"DOC201",
   "DOC202",
   "DOC402",
   "DOC403",
   #"DOC501",
]
extend-ignore = [
    "D203",
    "D213",
    "SIM105"
]
preview = true
explicit-preview-rules = true
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # allow assert statements in tests
    "ANN",    # don't require type annotations in tests
    "D",      # don't require docstrings in tests
]
"plugins/paraview/*.py" = ["N"]
"docs/_demos/**/*.py" = ["E", "D"]

[tool.ruff.lint.pycodestyle]
max-line-length = 96

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
root = ["."]
python-version = "3.11"

[tool.ty.terminal]
output-format = "concise"

[[tool.ty.overrides]]
include = ["plugins/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
pythonpath = ["tecio"]
testpaths = ["tests"]